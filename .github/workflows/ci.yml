name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish --no-check-all

      - name: Check PHP coding standards
        run: npm run lint

      - name: Run static analysis
        run: npm run analyze

      - name: Verify generated readme
        run: |
          npm run build
          git diff --exit-code -- README.md
          test -z "$(git ls-files --others --exclude-standard -- readme.md)"

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

  current-phpunit:
    name: Public BFAL 2.1.0 stable - WordPress ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.5'
          - php: '8.1'
            wordpress: '6.7'
          - php: '8.3'
            wordpress: latest
          - php: '8.4'
            wordpress: latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes default-mysql-client subversion

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Report exact stable dependency
        run: |
          php -r 'require "vendor/autoload.php"; $package = "mickey-kay/better-font-awesome-library"; printf("BFAL version: %s\nBFAL reference: %s\n", Composer\InstalledVersions::getPrettyVersion($package), Composer\InstalledVersions::getReference($package));'
          node -e 'const lock = JSON.parse(require("fs").readFileSync("composer.lock", "utf8")); const item = lock.packages.find((entry) => entry.name === "mickey-kay/better-font-awesome-library"); process.exit(item && item.version === "2.1.0" && item.source.reference === "b845f8d2c105c34a9afe62e8470d67d0e3978164" && item.dist.reference === "b845f8d2c105c34a9afe62e8470d67d0e3978164" ? 0 : 1);'

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "${{ matrix.wordpress }}" true

      - name: Run single-site PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: Run multisite PHPUnit
        run: vendor/bin/phpunit --configuration phpunit-multisite.xml.dist

  rollback-phpunit:
    name: Stable BFAL 2.0.3 rollback - WordPress ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '6.5'
          - php: '8.1'
            wordpress: '6.7'
          - php: '8.3'
            wordpress: latest
          - php: '8.4'
            wordpress: latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes default-mysql-client subversion

      - name: Install exact stable rollback dependency in isolation
        run: |
          rollback_dir="$(mktemp -d)"
          cp composer.json composer.lock "$rollback_dir/"
          composer require --working-dir="$rollback_dir" mickey-kay/better-font-awesome-library:2.0.3 --with-dependencies --minimal-changes --no-interaction --no-progress
          mv "$rollback_dir/vendor" vendor
          git diff --exit-code -- composer.json composer.lock

      - name: Report exact rollback dependency
        run: |
          php -r 'require "vendor/autoload.php"; $package = "mickey-kay/better-font-awesome-library"; $version = Composer\InstalledVersions::getPrettyVersion($package); $reference = Composer\InstalledVersions::getReference($package); printf("BFAL version: %s\nBFAL reference: %s\n", $version, $reference); exit("2.0.3" === $version && "c5ae75d273ff8a594f9fa58b43542d6dc1482fb0" === $reference ? 0 : 1);'

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "${{ matrix.wordpress }}" true

      - name: Run rollback single-site PHPUnit
        run: vendor/bin/phpunit --configuration phpunit-rollback.xml.dist

      - name: Run rollback multisite PHPUnit
        run: vendor/bin/phpunit --configuration phpunit-rollback-multisite.xml.dist

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install Node.js dependencies
        run: npm ci

      - name: Verify release safeguards
        run: |
          if npx grunt release; then
            echo "Release unexpectedly accepted a missing version."
            exit 1
          fi
          if npx grunt release --release-version=invalid; then
            echo "Release unexpectedly accepted an invalid version."
            exit 1
          fi
          mkdir -p svn/tags/9.9.9
          touch svn/tags/9.9.9/existing-tag-marker
          if npx grunt release --release-version=9.9.9; then
            echo "Release unexpectedly replaced an existing tag."
            exit 1
          fi
          test -f svn/tags/9.9.9/existing-tag-marker

      - name: Build WordPress.org release tree
        run: npx grunt build-release-tree

      - name: Audit WordPress.org release tree
        run: sh bin/audit-release-tree.sh

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './svn/trunk'
          slug: better-font-awesome
